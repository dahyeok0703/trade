# Supabase local development config.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "trade-docs"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Local mailbox (Inbucket) for testing confirmation / reset emails.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local dev: skip the confirmation step so sign-up returns a session immediately.
# Enable this in production.
enable_confirmations = false
